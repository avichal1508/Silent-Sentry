
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Defense | Secure Upload</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron', sans-serif;
}

body{
background:#0b1220;
color:white;
overflow-x:hidden;
}

/* Cyber Grid Background */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:
linear-gradient(rgba(0,255,255,0.06) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,255,0.06) 1px, transparent 1px);
background-size:50px 50px;
animation:gridMove 20s linear infinite;
z-index:-1;
}

@keyframes gridMove{
from{background-position:0 0;}
to{background-position:50px 50px;}
}

/* Navbar */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(10px);
}

nav h1{
color:#00ffff;
}

nav ul{
list-style:none;
display:flex;
gap:30px;
}

nav ul li{
cursor:pointer;
transition:0.3s;
}

nav ul li:hover{
color:#00ffff;
}

/* Upload Section */

.upload-container{
display:flex;
justify-content:center;
align-items:center;
gap:60px;
padding:80px 60px;
flex-wrap:wrap;
}

/* Image */

.upload-image img{
width:420px;
border-radius:15px;
box-shadow:0 0 40px rgba(0,255,255,0.4);
animation:float 5s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-20px);}
}

/* Upload Box */

.upload-box{
background:rgba(0,0,0,0.85);
padding:40px;
width:350px;
border-radius:15px;
text-align:center;
box-shadow:0 0 25px rgba(0,255,255,0.3);
}

.upload-box h2{
color:#00ffff;
margin-bottom:20px;
}

.upload-box p{
color:#bbb;
margin-bottom:20px;
}

.upload-box input{
margin:15px 0;
}

/* Button */

.upload-btn{
padding:12px 30px;
background:#00ffff;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

.upload-btn:hover{
box-shadow:0 0 25px #00ffff;
transform:scale(1.05);
}

/* Footer */

footer{
background:#000;
padding:25px;
text-align:center;
color:#aaa;
font-size:14px;
}

</style>
</head>

<body>

<nav>
<h1>Cyber Defense</h1>
<ul>
<li onclick="window.location.href='index.html'">Home</li>
<li onclick="window.location.href='about.html'">About</li>
<li>Upload</li>
<li onclick="window.location.href='contact.html'">Contact</li>
<li onclick="window.location.href='login.html'">Login</li>
</ul>
</nav>

<section class="upload-container">

<div class="upload-image">
<img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b">
</div>

<div class="upload-box">

<h2>Secure File Upload</h2>

<p>Upload files securely for cybersecurity analysis and threat detection.</p>

<form>

<input type="file" required>

<br><br>

<button class="upload-btn">Upload File</button>

</form>

</div>

</section>

<footer>
© 2026 Cyber Defense | Secure Upload System
</footer>

</body>
</html>
